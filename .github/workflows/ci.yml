name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regops
          POSTGRES_PASSWORD: regops_dev_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://regops:regops_dev_password@localhost:5432/regops_ai?schema=public

      - name: Setup Test Databases
        run: pnpm test:setup
        env:
          DATABASE_URL: postgresql://regops:regops_dev_password@localhost:5432/regops_ai?schema=public
          WEB_TEST_DATABASE_URL: postgresql://regops:regops_dev_password@localhost:5432/regops_ai_web_test?schema=public
          DATABASE_TEST_DATABASE_URL: postgresql://regops:regops_dev_password@localhost:5432/regops_ai_database_test?schema=public

      - run: pnpm lint
      - run: pnpm typecheck

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://regops:regops_dev_password@localhost:5432/regops_ai?schema=public
          WEB_TEST_DATABASE_URL: postgresql://regops:regops_dev_password@localhost:5432/regops_ai_web_test?schema=public
          DATABASE_TEST_DATABASE_URL: postgresql://regops:regops_dev_password@localhost:5432/regops_ai_database_test?schema=public
          AUTH_SECRET: ci-auth-secret-min-32-characters-long
          AUTH_TRUST_HOST: "true"
          NODE_ENV: test

      - run: pnpm build
        env:
          DATABASE_URL: postgresql://regops:regops_dev_password@localhost:5432/regops_ai?schema=public
          AUTH_SECRET: ci-auth-secret-min-32-characters-long
