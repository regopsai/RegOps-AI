services:
  postgres:
    image: postgres:16
    container_name: regops-ai-postgres
    environment:
      POSTGRES_DB: regops_ai
      POSTGRES_USER: regops
      POSTGRES_PASSWORD: regops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regops -d regops_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
